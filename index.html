<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MYPOD</title>
    <link rel="icon" href="favicon.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        /* قمنا بتغيير لون الخلفية ليكون #1d3860 في كل مكان */
        body { background: #1d3860; font-family: Arial, sans-serif; height: 100vh; overflow: hidden; }

        .hero-container { 
            width: 100%; 
            height: 100vh; 
            position: relative; 
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #1d3860; /* توحيد اللون هنا */
        }
        
        /* الصورة */
        .hero-image { width: 100%; height: 100%; display: block; }
        .hero-image img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover; 
            object-position: center center;
        }

        /* المحتوى */
        .content {
            position: absolute;
            bottom: 60px;
            left: 0;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            padding: 0 20px;
        }

        .btn { background:#C8A76A; color:white; padding:18px 50px; border-radius:999px; text-decoration:none; font-size:18px; transition:.3s; }
        .btn:hover { transform:scale(1.05); background:#DAB97B; }
        .small-text { color:#C8A76A; font-size:13px; text-align: center; }
        .social { display:flex; gap:18px; }
        .icon { font-size:28px; color:#C8A76A; }
        .contact { color:#C8A76A; font-size:13px; text-decoration:underline; }

        /* تحسينات الموبايل */
        @media (max-width: 768px) {
            .btn { padding: 15px 40px; font-size: 16px; }
            
            .hero-image img {
                /* استخدام contain يضمن ظهور الصورة كاملة */
                object-fit: contain;
                /* الخلفية الآن مطابقة للون الذي اخترته */
                background-color: #1d3860;
            }
        }
    </style>
</head>

<body>

    <div class="hero-container">
        <picture class="hero-image">
            <source media="(max-width: 768px)" srcset="design-mobile.png">
            <img src="design-desktop.png" alt="MYPOD Background">
        </picture>

        <div class="content">
            <a class="btn" href="https://forms.gle/h5rs7GbeX8eCWi8j7" target="_blank">Join the Waitlist</a>
            <div class="small-text">VIP opening invites & exclusive offers</div>
            <div class="social">
                <a class="icon" href="http://www.instagram.com/mypod_pilates/" target="_blank"><i class="fa-brands fa-instagram"></i></a>
                <a class="icon" href="http://linktr.ee/mypod.pilates" target="_blank"><i class="fa-solid fa-link"></i></a>
            </div>
            <a class="contact" href="http://linktr.ee/mypod.pilates" target="_blank">Contact us</a>
        </div>
    </div>

</body>
</html>
