<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<title>MYPOD</title>

<link rel="icon" href="favicon.png">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

html,body{
margin:0;
padding:0;
background:#000;
font-family:Arial;
overflow:hidden;
}

/* ===== الصور ===== */
.hero{
width:100%;
height:100vh;
object-fit:cover;
display:block;
}

/* ===== المحتوى ===== */
.content{
position:absolute;
top:85%;
left:50%;
transform:translate(-50%,-50%);
display:flex;
flex-direction:column;
align-items:center;
gap:14px;
text-align:center;
width:100%;
}

/* ===== الزر ===== */
.btn{
background:#C8A76A;
color:white;
padding:18px 50px;
border-radius:999px;
text-decoration:none;
font-size:18px;
transition:.3s;
}

.btn:hover{
transform:scale(1.05);
background:#DAB97B;
}

/* ===== النص ===== */
.small-text{
color:#C8A76A;
font-size:13px;
}

/* ===== الأيقونات ===== */
.social{
display:flex;
gap:18px;
}

.icon{
font-size:28px;
color:#C8A76A;
}

/* ===== Contact ===== */
.contact{
color:#C8A76A;
font-size:13px;
text-decoration:underline;
}

/* ===== موبايل تحسين فقط (بدون تبديل صور) ===== */
@media (max-width:768px){

.content{
top:82%;
gap:18px;
}

.btn{
font-size:20px;
padding:20px 55px;
}

.icon{
font-size:32px;
}

.small-text{
font-size:14px;
}

}

</style>

</head>

<body>

<!-- ⚠️ صورة واحدة فقط (حل كل المشاكل) -->
<img class="hero" src="design-mobile.png">

<div class="content">

<a class="btn" href="https://forms.gle/h5rs7GbeX8eCWi8j7" target="_blank">
Join the Waitlist
</a>

<div class="small-text">
VIP opening invites & exclusive offers
</div>

<div class="social">

<a class="icon" href="http://www.instagram.com/mypod_pilates/" target="_blank">
<i class="fa-brands fa-instagram"></i>
</a>

<a class="icon" href="http://linktr.ee/mypod.pilates" target="_blank">
<i class="fa-solid fa-link"></i>
</a>

</div>

<a class="contact" href="http://linktr.ee/mypod.pilates" target="_blank">
Contact us
</a>

</div>

</body>

</html>
