<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<title>MYPOD</title>

<link rel="icon" type="image/png" href="favicon.png">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

html,body{
margin:0;
padding:0;
background:#000;
font-family:Arial;
}

/* ===== الصور (حل نهائي للموبايل والديسكتوب) ===== */
.hero{
width:100%;
height:100vh;
display:block;
object-fit:cover;
}

/* نخفي/نظهر حسب الجهاز */
.hero-mobile{
display:none;
}

@media (max-width:768px){

.hero-desktop{
display:none;
}

.hero-mobile{
display:block;
}

}

/* ===== المحتوى ===== */
.content{
position:absolute;
top:84%;
left:50%;
transform:translate(-50%,-50%);
display:flex;
flex-direction:column;
align-items:center;
text-align:center;
gap:12px;
width:100%;
}

/* ===== الزر ===== */
.btn{
background:#C8A76A;
color:white;
padding:16px 42px;
border-radius:999px;
text-decoration:none;
font-size:18px;
transition:.3s;
}

.btn:hover{
background:#DAB97B;
transform:scale(1.05);
}

/* ===== النص الصغير ===== */
.small-text{
color:#C8A76A;
font-size:12px;
}

/* ===== الأيقونات ===== */
.social{
display:flex;
gap:18px;
}

.icon{
font-size:26px;
color:#C8A76A;
text-decoration:none;
}

/* ===== Contact ===== */
.contact{
color:#C8A76A;
font-size:13px;
text-decoration:underline;
}

</style>

</head>

<body>

<!-- صور الموقع -->
<img class="hero hero-desktop" src="design-desktop.png">
<img class="hero hero-mobile" src="design-mobile.png">

<div class="content">

<a class="btn" href="https://forms.gle/h5rs7GbeX8eCWi8j7" target="_blank">
Join the Waitlist
</a>

<div class="small-text">
VIP opening invites & exclusive offers
</div>

<div class="social">

<a class="icon" href="http://www.instagram.com/mypod_pilates/" target="_blank">
<i class="fa-brands fa-instagram"></i>
</a>

<a class="icon" href="http://linktr.ee/mypod.pilates" target="_blank">
<i class="fa-solid fa-link"></i>
</a>

</div>

<a class="contact" href="http://linktr.ee/mypod.pilates" target="_blank">
Contact us
</a>

</div>

</body>

</html>
